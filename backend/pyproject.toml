[project]
name = "ai-shorts-backend"
version = "0.1.0"
description = "SQLAlchemy-backed FastAPI backend for AI Shorts Generator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.30,<1",
  "pwdlib[argon2]>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "jsonschema>=4,<5",
  "openapi-spec-validator>=0.7,<1",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
