            text_color:
              type: string
            active_color:
              type: string
            outline_color:
              type: string
            outline:
              type: number
            shadow:
              type: number
            shadow_color:
              type: string
            shadow_opacity:
              type: number
            inactive_opacity:
              type: number
            active_scale:
              type: integer
            uppercase:
              type: boolean
            letter_spacing:
              type: number
            line_height:
              type: number
            position:
              type: number
            css_font_size:
              type: number
              description: Equivalent CSS font-size on the 1080px-wide canvas (libass sizes by ascent plus descent).
            max_width:
              type: number
              description: Widest caption line as a fraction of frame width; longer lines shrink.
          description: Sizes are pixels on the 1080x1920 canvas; position is the vertical centre as a fraction of
            height.
    AuthOptions:
      type: object
      required:
      - google
      - password
      properties:
        google:
          type: boolean
        password:
          type: boolean
    RefreshResult:
      type: object
      required:
      - csrfToken
      - expiresIn
      properties:
        csrfToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds until the new access cookie expires.
  responses:
    Error401:
      description: UNAUTHENTICATED — session missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: ACCOUNT_DISABLED — account is disabled; sign-in can also return NOT_INVITED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: NOT_FOUND — resource missing, deleted, or owned by another creator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error402:
      description: MONTHLY_LIMIT_REACHED — processing would exceed the allowance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: INVALID_STATE or ACTIVE_JOB_EXISTS — action unavailable, expired upload, or conflicting compute-intensive
        job.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error410:
      description: ASSET_EXPIRED — transcript/analysis retention elapsed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: SOURCE_TOO_LARGE — source exceeds 4 GiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: UNSUPPORTED_MEDIA — unsupported container/stream, dimensions, or frame rate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: INVALID_INPUT, DOWNLOAD_FAILED, SOURCE_TOO_LONG, SOURCE_TOO_SHORT, SOURCE_TOO_LARGE, MEDIA_PROBE_FAILED,
        UNSUPPORTED_URL or RIGHTS_NOT_CONFIRMED — request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: IMPORT_UNAVAILABLE — YouTube import feature disabled or unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: SERVER_ERROR — unexpected backend failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
