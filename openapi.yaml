  /v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      tags:
      - Authentication
      summary: Begin Google sign-in
      security: []
      description: Redirects to Google requesting only openid email profile, with single-use state, a nonce and
        a PKCE challenge bound to this browser by a short-lived httpOnly cookie. Without Google configuration, redirects
        to the frontend with auth_error=GOOGLE_UNAVAILABLE.
      responses:
        '303':
          description: To Google's consent screen.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '500':
          $ref: '#/components/responses/Error500'
  /v1/auth/google/callback:
    get:
      operationId: finishGoogleSignIn
      tags:
      - Authentication
      summary: Google sign-in callback
      security: []
      description: Consumes the state, exchanges the code, and verifies the ID token server-side (signature against
        Google's keys, issuer, audience, expiry, nonce, verified email). Users are found by Google sub; an invited
        account is linked by verified email on first sign-in. Sets session cookies and redirects to the frontend,
        or redirects with auth_error=<code>. Never returns tokens in the URL.
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '303':
          description: To the frontend.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Authentication
      summary: Rotate the session cookies
      security: []
      description: Uses the shorts_refresh cookie (path /v1/auth). Each refresh token works once and is replaced.
        Replaying a used token revokes the whole session (401); a second refresh racing within 10 s returns 409
        REFRESH_IN_PROGRESS without revoking.
      responses:
        '200':
          description: New cookies set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'API clients: obtain access_token from POST /v1/auth/google (email/password, when enabled). Tokens
        expire after expires_in seconds and are revocable with logout.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: shorts_session
      description: 'Browsers: httpOnly session cookie set by Google sign-in or password login, valid 15 minutes
        and renewed with POST /v1/auth/refresh. Unsafe methods also require the session''s csrfToken in X-CSRF-Token
        and an allowed Origin.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Optional key for process, retry and analysis requests. Scoped to creator, project and operation.
        Replays return the original accepted response without duplicate work or usage charges. Reusing a key with
        different input returns INVALID_INPUT. Use a new key for a new action.
  schemas:
    Goal:
      type: string
      enum:
      - educational
      - entertaining
      - viral
    ProjectState:
      type: string
      enum:
      - draft
      - uploading
      - transcribing
      - analyzing
      - ready
      - failed
      - canceled
      - expired
      - deleted
    Guidance:
      type: object
      required:
      - goal
      properties:
        goal:
          $ref: '#/components/schemas/Goal'
        instruction:
          type: string
          maxLength: 200
          default: ''
        avoid:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 10
          default: []
    SignInRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
      description: Password login for seeded, invited development accounts. The existing route name is retained;
        no Google identity exchange is performed.
    User:
      type: object
      required:
      - id
      - email
      - displayName
      - role
      properties:
        id:
          type: string
          description: Opaque identifier.
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
          - creator
          - operator
        avatarUrl:
          type: string
          format: uri
          nullable: true
        googleLinked:
          type: boolean
          description: Signed in with Google at least once.
    UsageSummary:
      type: object
      required:
      - usedMinutes
      - limitMinutes
      - remainingMinutes
      properties:
        usedMinutes:
          type: integer
          minimum: 0
        limitMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: Null means this creator has no monthly processing limit.
        remainingMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: Null when the creator has no monthly processing limit.
      description: Calendar-month usage. A null limit and remaining balance mean no monthly cap. Default limit is
        60 minutes.
    LedgerEntry:
      type: object
      required:
      - id
      - userId
      - projectId
      - jobId
      - usageType
      - processedSeconds
      - adjustmentSeconds
      - createdAt
      properties:
        id:
          type: string
          description: Opaque identifier.
        userId:
          type: string
          description: Opaque identifier.
        projectId:
          type: string
          description: Opaque identifier.
        jobId:
          type: string
          description: Opaque identifier.
          nullable: true
        usageType:
          type: string
          description: Currently transcription.
        processedSeconds:
          type: integer
          minimum: 0
        adjustmentSeconds:
          type: integer
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds, not an ISO date string.
    Usage:
      type: object
      required:
      - usedMinutes
      - limitMinutes
      - remainingMinutes
      - entries
      properties:
        usedMinutes:
          type: integer
          minimum: 0
        limitMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: Null means this creator has no monthly processing limit.
        remainingMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: Null when the creator has no monthly processing limit.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
      description: Summary plus append-only ledger entries for the authenticated creator in the current UTC calendar
        month. Retries must not double-count processing.
    ActiveJob:
      type: object
      required:
      - id
      - projectId
      - type
      - stage
      properties:
        id:
          type: string
          description: Opaque identifier.
        projectId:
          type: string
          description: Opaque identifier.
        type:
          type: string
          enum:
          - process
          - analysis
        stage:
          type: string
          enum:
          - transcribing
          - analyzing
    Session:
      type: object
      required:
      - user
      - features
      - usage
      - activeJob
      properties:
        user:
          $ref: '#/components/schemas/User'
        features:
          type: object
          required:
          - youtubeImport
          properties:
            youtubeImport:
              type: boolean
        usage:
          $ref: '#/components/schemas/UsageSummary'
        activeJob:
          type: object
          required:
          - id
          - projectId
          - type
          - stage
          properties:
            id:
              type: string
              description: Opaque identifier.
            projectId:
              type: string
              description: Opaque identifier.
            type:
              type: string
              enum:
              - process
              - analysis
            stage:
              type: string
              enum:
              - transcribing
              - analyzing
          nullable: true
        csrfToken:
          type: string
          nullable: true
          description: Present for cookie sessions; send it as X-CSRF-Token on POST, PATCH and DELETE.
    Project:
      type: object
      required:
      - id
      - name
      - sourceType
      - status
      - durationSec
      - width
      - height
      - fps
      - sizeBytes
      - language
      - goal
      - instruction
      - avoid
      - createdAt
      - suggestionCount
      - renderCount
      - sourceExpiresAt
      - sourceExpired
      - analysisExpiresAt
      - clipsStale
      - failureCode
      - transcriptRevision
      properties:
        id:
          type: string
          description: Opaque identifier.
        name:
          type: string
        sourceType:
          type: string
          enum:
          - upload
          - youtube_url
        status:
          $ref: '#/components/schemas/ProjectState'
        durationSec:
          type: number
        width:
          type: integer
        height:
          type: integer
        fps:
          type: number
        sizeBytes:
          type: integer
          format: int64
        language:
          type: string
          nullable: true
        goal:
          type: string
          enum:
          - educational
          - entertaining
          - viral
          nullable: true
        instruction:
          type: string
        avoid:
          type: array
          items:
            type: string
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds, not an ISO date string.
        suggestionCount:
          type: integer
          minimum: 0
        renderCount:
          type: integer
          minimum: 0
        sourceExpiresAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds, not an ISO date string.
          nullable: true
        sourceExpired:
          type: boolean
        analysisExpiresAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds, not an ISO date string.
          nullable: true
        clipsStale:
          type: boolean
        failureCode:
          type: string
          nullable: true
        transcriptRevision:
          type: integer
          minimum: 1
          nullable: true
    UploadRequest:
      type: object
      required:
      - fileName
      - mimeType
      - sizeBytes
      - durationSec
      - width
      - height
      - fps
      - hasVideo
      - hasAudio
      properties:
        fileName:
          type: string
          description: MP4, MOV or WebM filename.
        title:
          type: string
        mimeType:
          type: string
          description: Video MIME type; the browser can supply an empty string.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967296
        durationSec:
          type: number
          minimum: 30
          maximum: 10800
        width:
          type: integer
          minimum: 1
          maximum: 7680
        height:
          type: integer
          minimum: 1
          maximum: 7680
        fps:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 120
        hasVideo:
          type: boolean
          enum:
          - true
        hasAudio:
          type: boolean
      description: Browser-probed metadata used for early validation. The backend verifies uploaded byte count and
        extension but does not independently probe the media streams yet.
    UploadSession:
      type: object
      required:
      - uploadId
      - projectId
      - uploadUrl
      - expiresAt
      - project
      properties:
        uploadId:
          type: string
          description: Opaque identifier.
        projectId:
          type: string
          description: Opaque identifier.
        uploadUrl:
          type: string
          description: Relative upload endpoint for sending the video bytes.
        expiresAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds, not an ISO date string.
        project:
          $ref: '#/components/schemas/Project'
    MediaUploadResult:
      type: object
      required:
      - ok
      - bytes
      properties:
        ok:
          type: boolean
          enum:
          - true
        bytes:
          type: integer
          minimum: 0
    PlaybackLink:
      type: object
      required:
      - url
      - expiresAt
      properties:
        url:
          type: string
          description: Relative API path with a short-lived signature.
        expiresAt:
          type: integer
          format: int64
