openapi: 3.0.3
info:
  title: AI Shorts Generator — frontend API contract
  version: 1.4.0
  description: 'Contract for the frontend API, with password/bearer authentication and local media playback.


    Requests and responses are JSON. GET operations have no body or query parameters. Timestamps are Unix milliseconds;
    media positions and durations are seconds. Successful operations return 200.


    Protected operations require Authorization: Bearer <access_token>, an active invited account, and project/upload
    ownership. Foreign IDs return 404 just like missing IDs. Operators do not bypass ownership. Tokens expire and
    logout revokes the presented token.


    Authentication change from the original frontend contract: POST /v1/auth/google now requires email and password
    and returns the Session fields plus access_token, token_type and expires_in. The legacy route name is retained
    for compatibility; this is password authentication, not Google OAuth. Email-only mock login and cookie-only
    authentication are no longer accepted. The frontend uses HTTP mode with a password form; its client retains
    the bearer token in memory and attaches it to subsequent requests. Refreshing the page requires sign-in again.


    The SQLAlchemy backend persists application data and uploaded source files across restarts. Source media is
    stored below MEDIA_DIR/sources using opaque filenames and is streamed with byte-range support through short-lived
    signed playback links. Selected suggestions can be rendered with FFmpeg into vertical H.264/AAC MP4 files under
    MEDIA_DIR/renders (backend/media/renders by default). Rendered files are retained for seven days, listed in
    project downloads, and available through signed preview/download URLs. Processing/transcripts/suggestions remain
    demo content; YouTube import is disabled by default and downloads rights-confirmed videos when enabled. There
    is no real transcription, LLM or object-storage integration.'
servers:
- url: /
  description: Same origin by default; createHttpApi can configure a baseUrl.
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /v1/auth/google:
    post:
      operationId: signIn
      summary: Sign in to the private beta
      description: Email/password login, available when ALLOW_PASSWORD_LOGIN is true (otherwise 403 PASSWORD_LOGIN_DISABLED).
        Verifies a hashed password for an active invited account, starts a cookie session (shorts_session / shorts_refresh)
        and also returns a bearer access_token for API clients. Despite the path, Google sign-in is GET /v1/auth/google/start.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
  /v1/auth/logout:
    post:
      operationId: signOut
      summary: End the application session
      description: No request body. Revokes the presented bearer token and/or this browser's cookie session (all
        its access and refresh tokens) and clears the session cookies.
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/me:
    get:
      operationId: me
      summary: Get current user, features, usage and active job
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/uploads:
    post:
      operationId: createUpload
      summary: Create an upload session
      description: Validate supplied metadata and create an uploading project. Returns the protected relative endpoint
        for streaming video bytes; upload sessions expire after 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Error401'
        '402':
          $ref: '#/components/responses/Error402'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: Complete an upload
      description: No request body. Verify that source bytes were stored and mark the project ready for processing.
      parameters:
      - name: id
        in: path
        required: true
        description: Upload session ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/uploads/{id}/media:
    post:
      operationId: uploadMedia
      summary: Upload source video bytes
      description: Stream the source into the configured local media directory. The byte count must match the metadata
        submitted to createUpload. Requires ownership of the upload session.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Upload session ID.
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/quicktime:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Video bytes stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResult'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/youtube:
    post:
      operationId: createYoutubeProject
      summary: Import a supported YouTube video
      description: Requires YOUTUBE_IMPORT=true and explicit rights confirmation. Downloads one YouTube video to
        private local source storage before returning a source-ready project. Supports watch and short-link URLs
        only; playlists are ignored. Enforces a 30-second to 3-hour duration and 4-GiB file size limit. Call processProject
        separately after a successful download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YoutubeRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error401'
        '402':
          $ref: '#/components/responses/Error402'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /v1/projects:
    get:
      operationId: listProjects
      summary: List own projects
      description: Bare array ordered newest first. Deleted projects are excluded. No pagination or filters are
        sent by the client.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get an owned project
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      operationId: deleteProject
      summary: Delete a project and queue asset removal
      description: No request body. Revoke access immediately, cancel active work and queue removal of associated
        assets.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/playback:
    post:
      operationId: getProjectPlayback
      summary: Create a short-lived source-video playback link
      description: Requires project ownership. The signed URL supports browser video playback and byte-range seeking.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Project ID.
      responses:
        '200':
          description: Signed source playback URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackLink'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/render:
    post:
      operationId: renderClip
      summary: Render a suggested clip to vertical MP4
      description: 'Requires project ownership, ready non-stale suggestions, and an uploaded source video. FFmpeg
        cuts the selected continuous source interval into a 9:16 canvas: framing crop (default) fills it with a
        centered crop; fit keeps the whole frame with black padding. With captions (default), the clip''s caption
        track is burned in as word-highlighted ASS karaoke in the chosen preset; clips without speech render without
        captions. Captions come from the stored transcript and never re-transcribe. The MP4 is saved under MEDIA_DIR/renders.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Rendered short and signed preview/download links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderedClip'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          description: FFmpeg renderer is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{id}/process:
    post:
      operationId: processProject
      summary: Start transcription and clip analysis
      description: Requires completed upload/source readiness and uploading state. Enforce one compute-intensive
        job per creator. Poll getStatus.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guidance'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Error401'
        '402':
          $ref: '#/components/responses/Error402'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/retry:
    post:
      operationId: retryProject
      summary: Retry a failed project
      description: UI sends {}. Reuses previous guidance and completed transcript if present; does not double-charge
        usage.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '402':
          $ref: '#/components/responses/Error402'
  /v1/projects/{id}/cancel:
    post:
      operationId: cancelProject
      summary: Cancel active source processing
      description: No request body. Only process jobs are cancelable in this client contract; analysis regeneration
        is not. Account only for processed source seconds.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/status:
    get:
      operationId: getStatus
      summary: Poll processing status
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/transcript:
    get:
      operationId: getTranscript
      summary: Read timestamped transcript
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      operationId: saveTranscript
      summary: Correct transcript text
      description: Preserve source timing; use segment timing when word alignment is unsafe. Marks existing suggestions
        stale without retranscription. Reject while a project job is active.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptEdit'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/downloads:
    get:
      operationId: getProjectDownloads
      summary: Get transcript download links
      description: Bare array containing TXT and JSON downloads. Download JSON contains language, revision and segments;
        it is not the full Transcript API response.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Download'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/clips:
    get:
      operationId: getClips
      summary: Read current clip suggestions
      description: Returns empty clips before an analysis run exists. Existing clips may remain available during
        regeneration; stale indicates transcript edits invalidated them.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clips'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '410':
          $ref: '#/components/responses/Error410'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/projects/{id}/analysis-runs:
    post:
      operationId: createAnalysisRun
      summary: Regenerate clip suggestions
      description: Requires ready project and retained transcript. Reuses transcription and preprocessing without
        additional source-minute usage. Failure may preserve ready state and existing clips, with regenError populated.
      parameters:
      - name: id
        in: path
        required: true
        description: Creator-owned project ID.
        schema:
          type: string
          description: Opaque identifier.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guidance'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/media/{project_id}:
    get:
      operationId: streamProjectMedia
      summary: Stream source video bytes
      description: Public only through an expiring HMAC-signed playback URL returned by getProjectPlayback. Supports
        single HTTP byte ranges for seeking. The signature becomes invalid when the source expires or is deleted.
      security: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        description: Unix expiration timestamp in seconds.
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Source video.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range of the source video.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '416':
          description: Requested byte range is not satisfiable.
        '500':
          $ref: '#/components/responses/Error500'
  /v1/rendered/{render_id}:
    get:
      operationId: streamRenderedClip
      summary: Preview or download a rendered short
      description: Public only through an expiring signed URL returned by renderClip or getProjectDownloads. Supports
        byte ranges. Use download=true to return attachment disposition.
      security: []
      parameters:
      - name: render_id
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Rendered MP4.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range of rendered MP4.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /v1/usage:
    get:
      operationId: getUsage
      summary: Get monthly usage and ledger
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/social-accounts:
    get:
      tags:
      - Social publishing
      summary: List Accounts
      operationId: listSocialAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccountsView'
        '422':
          description: Invalid request fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Stable API error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /v1/social-accounts/{platform}/connect:
    get:
      tags:
      - Social publishing
      summary: Connect
      operationId: connectSocialAccount
      security:
      - bearerAuth: []
      parameters:
      - name: platform
        in: path
        required: true
        schema:
          enum:
          - youtube
          - tiktok
