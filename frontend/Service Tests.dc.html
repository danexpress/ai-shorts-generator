<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="industry.css">
<style>body{margin:0} a{color:var(--color-accent-700)} a:hover{color:var(--color-accent-900)}</style>
<script src="services.js"></script>
<script src="tests.js"></script>
</helmet>
<div data-screen-label="Service tests" style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">
  <main style="max-width:1000px;margin:0 auto;padding:40px 28px 80px;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)">AI Shorts Generator · services layer</div><h1 style="margin:4px 0 0">Service tests</h1></div>
      <div style="display:flex;gap:10px;align-items:center"><a href="AI Shorts Generator.dc.html" style="font-size:14px">Back to app</a><button class="btn btn-primary" disabled="{{ running }}" onClick="{{ run }}">{{ runLabel }}</button></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
        <div class="blueprint" style="padding:16px 18px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700)">{{ s.label }}</div><div style="font-family:var(--font-heading);font-weight:600;font-size:34px;line-height:1.1">{{ s.value }}</div></div>
      </sc-for>
    </div>
    <p style="margin:0;font-size:14px;color:var(--color-neutral-800)">Runs in the browser against isolated mock backends with a fake clock. The same file runs headless with <code style="font-family:ui-monospace,monospace;font-size:13px">node tests.js</code>.</p>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <section class="blueprint"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div style="display:flex;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--color-divider)"><h4 style="margin:0">{{ g.name }}</h4><span style="font-size:13px;color:var(--color-neutral-700)">{{ g.summary }}</span></div>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
          <div style="display:grid;grid-template-columns:52px minmax(0,1fr) 60px;gap:12px;padding:10px 18px;border-bottom:1px solid var(--color-divider);align-items:start">
            <span class="{{ r.tagClass }}" style="justify-content:center">{{ r.status }}</span>
            <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px">{{ r.name }}</span><sc-if value="{{ r.error }}" hint-placeholder-val="{{ false }}"><span style="font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere">{{ r.error }}</span></sc-if></div>
            <span style="font-family:ui-monospace,monospace;font-size:12px;text-align:right;color:var(--color-neutral-700)">{{ r.ms }}</span>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { results: [], running: false, ready: false };
  componentDidMount() {
    const wait = () => { if (!window.ShortsTests) return void (this.t = setTimeout(wait, 50)); this.setState({ ready: true }); this.run(); };
    wait();
  }
  componentWillUnmount() { clearTimeout(this.t); }
  async run() {
    this.setState({ running: true, results: [] });
    await window.ShortsTests.run((r, all) => this.setState({ results: all.slice() }));
    this.setState({ running: false });
  }
  renderVals() {
    const list = this.state.ready ? window.ShortsTests.list : [];
    const byKey = {};
    this.state.results.forEach((r) => { byKey[r.group + '|' + r.name] = r; });
    const names = [...new Set(list.map((t) => t.group))];
    const groups = names.map((name) => {
      const rows = list.filter((t) => t.group === name).map((t) => {
        const r = byKey[t.group + '|' + t.name];
        return { name: t.name, status: r ? (r.pass ? 'PASS' : 'FAIL') : '…', tagClass: r ? (r.pass ? 'tag tag-accent' : 'tag tag-neutral') : 'tag tag-outline', error: r && !r.pass ? r.error : '', ms: r ? r.ms + ' ms' : '' };
      });
      const done = rows.filter((x) => x.status !== '…');
      return { name, rows, summary: done.filter((x) => x.status === 'PASS').length + ' / ' + rows.length + ' passing' };
    });
    const res = this.state.results;
    const failed = res.filter((r) => !r.pass).length;
    return {
      groups, running: this.state.running, run: () => this.run(), runLabel: this.state.running ? 'Running…' : 'Run again',
      stats: [
        { label: 'Tests', value: list.length },
        { label: 'Passed', value: res.length - failed },
        { label: 'Failed', value: failed },
        { label: 'Duration', value: res.reduce((a, r) => a + r.ms, 0) + ' ms' },
      ],
    };
  }
}
</script>
</body>
</html>
