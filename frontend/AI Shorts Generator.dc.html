<script type="text/x-dc" data-dc-script data-props="{}">
const GOALS = [
  { id: 'educational', label: 'Educational', desc: 'Frameworks, lessons, clear takeaways.' },
  { id: 'entertaining', label: 'Entertaining', desc: 'Stories, humor, personality.' },
  { id: 'viral', label: 'Viral', desc: 'Immediate hooks, surprise, debate-worthy ideas from the source.' },
];
const STATUS_LABEL = { uploading: 'Uploading', transcribing: 'Transcribing', analyzing: 'Analyzing', ready: 'Ready', failed: 'Failed', canceled: 'Canceled', expired: 'Expired', draft: 'Draft' };
const fmt = (sec) => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; const p = (n) => String(n).padStart(2, '0'); return h ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s); };
const fmtDate = (t) => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const rel = (t) => { const h = (t - Date.now()) / 3600e3; return h < 48 ? Math.max(1, Math.round(h)) + 'h' : Math.round(h / 24) + ' days'; };
const parseAvoid = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);
// Social platforms in display order (matches the backend's PLATFORMS).
const PLATFORMS = ['youtube', 'tiktok', 'x', 'instagram'];
const idem = () => 'idem_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
// Story Mode: editor state lives here; story-ui.js only renders it.
const STORY_JOBS = ['voicing', 'rendering'];
const storyInitial = () => ({
  genres: [], lengths: [], providers: [], defaultProvider: null, assets: null, optionsError: null,
  form: { mode: 'topic', topic: '', story: '', genre: 'mystery', seconds: 45, tone: '' }, creating: false, createError: null,
  list: [], listLoading: false, listError: null,
  currentId: null, current: null, draft: null, dirty: false, busy: null, scriptError: null, loadError: null,
  voiceChoice: { provider: null, voice: null, speed: 1 }, renderChoice: null, audioUrl: null, audioFor: null, renders: [], imageLinks: [],
});
// "Script 4.2 s · $0.0300 · Voice 11.4 s · 581 chars · Render 3.9 s · Total $0.0300"
const costLine = (u) => {
  if (!u) return '';
  const money = (n) => (n ? '$' + n.toFixed(4) : 'free');
  const parts = [];
  if (u.script) parts.push('Script ' + (u.script.cached ? 'cached, free' : u.script.seconds.toFixed(1) + ' s · ' + money(u.script.costUsd)));
  if (u.voice) parts.push('Voice ' + u.voice.seconds.toFixed(1) + ' s · ' + u.voice.billedCharacters + ' new chars spoken · ' + money(u.voice.costUsd));
  if (u.images) parts.push('Pictures ' + u.images.seconds.toFixed(1) + ' s · ' + u.images.drawn + ' drawn · ' + money(u.images.costUsd));
  if (u.render) parts.push('Render ' + u.render.seconds.toFixed(1) + ' s');
  return parts.length ? parts.join(' · ') + ' — total ' + money(u.totalCostUsd) : '';
};
const spokenWords = (text) => (text.match(/\S+/g) || []).filter((w) => /[\p{L}\p{N}]/u.test(w)).length;

class Component extends DCLogic {
  state = {
    route: 'boot', bootError: null, me: null, loginEmail: '', loginPassword: '', loginBusy: false, loginError: null,
    authOptions: { google: false, password: true },
    accountDeletion: { confirm: '', busy: false, error: null },
    projects: [], projectId: null, project: null, status: null, uploading: false, uploadPct: 0,
    previewUrls: {}, pendingPreviewUrl: null, pendingFile: null,
    transcript: null, drafts: {}, clipsRes: null, selected: {}, previewId: null,
    renderedClips: [], renderingId: null, resolution: 1080, result: null, renderError: null,
    captions: { clipId: null, track: null, draft: null, loading: false, error: null, saving: false, dirty: false, confirmReset: false, texts: {} }, captionPresets: [], burnCaptions: true, framing: 'crop', captionFiles: {},
    publishing: {loading:false, busy:false, error:null, copy:{}, selected:{}, settings:{youtube:{visibility:'private',made_for_kids:false,contains_synthetic_media:false},tiktok:{privacy:'',allow_comment:false,allow_duet:false,allow_stitch:false,brand_content:false,brand_organic:false,is_aigc:false,consent:false},instagram:{share_to_feed:true}}, history:[], batch:null, creator:null, creatorError:null},
    social: { accounts: [], platforms: [], loading: false, error: null, busy: false },
    theme: 'system', dashboardLoading: false, dashboardError: null, clipsError: null,
    transcriptError: null, savingTranscript: false, usageLoading: false, usageError: null, usageEntries: [],
    np: { tab: 'upload', source: null, probing: false, error: null, code: null, goal: 'educational', instruction: '', avoid: '', url: '', rights: false, busy: false },
    regen: { goal: 'educational', instruction: '', avoid: '' },
    tests: { open: false, running: false, results: [] }, toast: null,
    story: storyInitial(),
  };

  componentDidMount() {
    this.disposed = false;
    this.socialListener = event => {
      if (!this.socialPopup || event.source !== this.socialPopup || event.origin !== new URL(window.SHORTS_CONFIG.apiBaseUrl || window.location.origin).origin || event.data?.type !== 'shorts-social-connection') return;
      this.socialPopup = null;
      this.setState(s => ({ social: { ...s.social, busy: false, error: event.data.ok ? null : 'The connection was not completed. Try connecting again.' } }));
      this.loadSocialAccounts().then(() => { if (this.state.route === 'publish') this.loadPublish(this.state.result, true); });
    };
    window.addEventListener?.('message', this.socialListener);
    try { this.setTheme(window.localStorage.getItem('shorts-theme') || 'system'); } catch (_) {}
    const boot = () => {
      if (!window.ShortsServices) return void (this.bootTimer = setTimeout(boot, 50));
      this.api = window.ShortsServices.createApi({
        mode: 'http',
        baseUrl: window.SHORTS_CONFIG.apiBaseUrl,
        onCall: (call) => { if (!call.ok && !['signIn', 'getAuthOptions', 'refreshSession'].includes(call.method) && this.state.route !== 'boot') this.handleAuth(call); },
      });
      this.pendingAuthError = this.takeAuthError();
      this.loadAuthOptions();
      return this.restoreSession();
    };
    return boot();
  }
  componentWillUnmount() { window.removeEventListener?.('message', this.socialListener); clearInterval(this.socialPopupTimer); clearTimeout(this.publishTimer); this.disposed = true; this.sessionRequest = (this.sessionRequest || 0) + 1; clearTimeout(this.bootTimer); this.stopPolling(); this.stopStoryPolling(); clearTimeout(this.toastTimer); this.releasePreviewUrls(); }

  // Google sign-in returns to the app with ?auth_error=<code> on failure; never tokens.
  takeAuthError() {
    try {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('auth_error');
      if (!code) return null;
      params.delete('auth_error');
      const query = params.toString();
      window.history?.replaceState(null, '', window.location.pathname + (query ? '?' + query : '') + window.location.hash);
      return window.ShortsServices.ERROR_COPY[code] || 'Sign-in didn’t complete. Try again.';
    } catch (_) { return null; }
  }
  async loadAuthOptions() {
    try { const authOptions = await this.api.getAuthOptions(); if (!this.disposed) this.setState({ authOptions }); }
    catch (_) { /* keep the defaults; the login form still works */ }
  }
  signInWithGoogle() {
    window.location.assign(window.ShortsServices.googleSignInUrl(window.SHORTS_CONFIG.apiBaseUrl || ''));
  }

  async deleteAccount() {
    const { accountDeletion: d, me } = this.state;
    if (d.busy || !me || d.confirm.trim().toLowerCase() !== me.user.email.toLowerCase()) return;
    this.setState({ accountDeletion: { ...d, busy: true, error: null } });
    try {
      const result = await this.api.deleteAccount({ confirmEmail: d.confirm.trim() });
      const names = { youtube: 'YouTube', tiktok: 'TikTok', x: 'X', instagram: 'Instagram' };
      const pending = result.notRevokedPlatforms.map((p) => names[p] || p);
      this.resetSession('Your account and its data were deleted. Posts already published on social platforms stay up.'
        + (pending.length ? ' We couldn’t revoke this app’s access at ' + pending.join(', ') + ' — remove it in that platform’s settings.' : ''));
    } catch (e) {
      if (!this.handleAuth(e)) this.setState((s) => ({ accountDeletion: { ...s.accountDeletion, busy: false, error: e.message } }));
    }
  }

  async restoreSession() {
    const request = this.sessionRequest = (this.sessionRequest || 0) + 1;
    this.setState({ route: 'boot', bootError: null });
    try {
      const me = await this.api.me();
      if (request !== this.sessionRequest || this.disposed) return;
      await this.enter(me);
    } catch (error) {
      if (request !== this.sessionRequest || this.disposed || error.code === 'SESSION_CHANGED') return;
      if (error.code === 'UNAUTHENTICATED') { this.resetSession(this.pendingAuthError); this.pendingAuthError = null; }
      else if (!this.handleAuth(error)) this.setState({ bootError: 'Check your connection and try again.' });
    }
  }

  releasePreviewUrls() {
    const urls = Object.values(this.state.previewUrls || {});
    if (this.state.pendingPreviewUrl) urls.push(this.state.pendingPreviewUrl);
    if (typeof URL !== 'undefined') urls.filter((url) => url.startsWith('blob:')).forEach((url) => URL.revokeObjectURL(url));
    this.state.previewUrls = {};
    this.state.pendingPreviewUrl = null;
    this.state.pendingFile = null;
  }

  notify(msg) { clearTimeout(this.toastTimer); this.setState({ toast: msg }); this.toastTimer = setTimeout(() => this.setState({ toast: null }), 3200); }
  async signIn(e) {
    e.preventDefault();
    if (this.state.loginBusy || !this.api) return;
    this.sessionRequest = (this.sessionRequest || 0) + 1;
    this.setState({ loginBusy: true, loginError: null });
    try {
      const me = await this.api.signIn({ email: this.state.loginEmail.trim(), password: this.state.loginPassword });
      await this.enter(me);
    } catch (error) {
      this.setState({ route: 'login', loginError: error.code === 'NETWORK_ERROR' ? 'We could not connect. Check your connection and try again in a moment.' : error.message });
    } finally { this.setState({ loginBusy: false, loginPassword: '' }); }
  }
  resetSession(message = null) {
    this.sessionRequest = (this.sessionRequest || 0) + 1;
    this.publishKey = null;
    clearTimeout(this.publishTimer); clearInterval(this.socialPopupTimer); this.publishVersion = (this.publishVersion || 0) + 1;
    this.probeVersion = (this.probeVersion || 0) + 1;
    this.stopPolling(); this.stopStoryPolling(); this.storyOptionsLoaded = false;
    this.releasePreviewUrls();
    this.setState({ route: 'login', bootError: null, me: null, loginPassword: '', loginError: message,
      publishing: {loading:false,busy:false,error:null,copy:{},selected:{},settings:{youtube:{visibility:'private',made_for_kids:false,contains_synthetic_media:false},tiktok:{privacy:'',allow_comment:false,allow_duet:false,allow_stitch:false,brand_content:false,brand_organic:false,is_aigc:false,consent:false},instagram:{share_to_feed:true}},history:[],batch:null,creator:null,creatorError:null},
      social: { accounts: [], platforms: [], loading: false, error: null, busy: false },
      projects: [], projectId: null, project: null, status: null, uploading: false, uploadPct: 0,
      transcript: null, drafts: {}, clipsRes: null, selected: {}, previewId: null,
      renderedClips: [], renderingId: null, result: null, renderError: null, usageEntries: [], captionFiles: {},
      captions: { clipId: null, track: null, draft: null, loading: false, error: null, saving: false, dirty: false, confirmReset: false, texts: {} },
      dashboardError: null, clipsError: null, transcriptError: null, usageError: null,
      np: { tab: 'upload', source: null, probing: false, error: null, code: null, goal: 'educational', instruction: '', avoid: '', url: '', rights: false, busy: false },
      regen: { goal: 'educational', instruction: '', avoid: '' }, toast: null, story: storyInitial(),
      accountDeletion: { confirm: '', busy: false, error: null } });
  }
  async signOut() {
    this.sessionRequest = (this.sessionRequest || 0) + 1;
    this.stopPolling();
    let message = null;
    try { await this.api.signOut(); }
    catch (e) { message = 'Signed out locally. The backend could not be reached to revoke the session.'; }
    finally { this.resetSession(message); }
  }
  async enter(me) { this.setState({ me, route: 'dashboard', loginError: null }); await this.loadDashboard(); }
  async refreshMe() { try { this.setState({ me: await this.api.me() }); } catch (e) { this.handleAuth(e); } }
  handleAuth(e) {
    if (e && ['UNAUTHENTICATED', 'ACCOUNT_DISABLED', 'NOT_INVITED'].includes(e.code)) {
      this.resetSession(e.message || window.ShortsServices.ERROR_COPY[e.code]);
      return true;
    }
    return false;
  }

  mediaUrl(url) {
    return new URL(url, window.SHORTS_CONFIG.apiBaseUrl || window.location.origin).href;
  }
  setTheme(theme) {
    if (!['light', 'dark', 'system'].includes(theme)) theme = 'system';
    this.setState({ theme });
    if (typeof document !== 'undefined') {
      if (theme === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.dataset.theme = theme;
    }
    try { window.localStorage.setItem('shorts-theme', theme); } catch (_) {}
  }
  async copy(value) {
    try { await navigator.clipboard.writeText(value || ''); this.notify('Copied to clipboard.'); }
    catch (_) { this.notify('Copy is unavailable in this browser. Select the text and copy it manually.'); }
  }
  async loadDashboard() {
    this.setState({ dashboardLoading: true, dashboardError: null });
    try {
      const [projects, me] = await Promise.all([this.api.listProjects(), this.api.me()]);
      this.setState({ projects, me });
      // Thumbnails come from real sources; expired/demo sources use a quiet placeholder.
      projects.slice(0, 8).filter(p => !p.sourceExpired && p.status === 'ready').forEach(async p => {
        try {
          const playback = await this.api.getProjectPlayback(p.id);
          if (!this.state.me || !this.state.projects.some(item => item.id === p.id)) return;
          this.setState(s => ({ previewUrls: { ...s.previewUrls, [p.id]: this.mediaUrl(playback.url) } }));
        } catch (_) {}
      });
    } catch (e) { if (!this.handleAuth(e)) this.setState({ dashboardError: e.message }); }
    finally { this.setState({ dashboardLoading: false }); }
  }
  go(route) {
    this.stopPolling(); clearTimeout(this.publishTimer); this.stopStoryPolling();
    this.setState({ route, previewId: null });
    if (route === 'stories') this.loadStories();
    if (route === 'dashboard' || route === 'projects') this.loadDashboard();
    if (route === 'usage') this.loadUsage();
    if (route === 'socialAccounts') this.loadSocialAccounts();
  }
  async loadSocialAccounts() {
    const epoch = this.sessionRequest;
    this.setState(s => ({social: {...s.social, loading: true}}));
    try { const data = await this.api.listSocialAccounts(); if (epoch !== this.sessionRequest || this.disposed) return; this.setState(s => ({social: {...s.social, ...data, loading: false}})); }
    catch(e) { if (epoch === this.sessionRequest && !this.handleAuth(e)) this.setState(s => ({social: {...s.social, loading: false, error: e.message}})); }
  }
  async connectSocial(platform) {
    if (this.state.social.busy) return;
    const popup = window.open('about:blank', 'shorts-social-connect', 'width=600,height=750');
    if (!popup) return this.setState(s => ({social: {...s.social, error: 'Allow popups for this site, then try connecting again.'}}));
    this.socialPopup = popup;
    this.setState(s => ({social: {...s.social, busy: true, error: null}}));
    try {
      const result = await this.api.connectSocialAccount(platform);
      if (!this.state.me || this.disposed) { popup.close(); return; }
      popup.location.href = result.authorization_url;
      clearInterval(this.socialPopupTimer);
      this.socialPopupTimer = setInterval(() => { if (popup.closed) { clearInterval(this.socialPopupTimer); this.socialPopup = null; this.setState(s => ({social: {...s.social, busy: false}})); this.loadSocialAccounts(); } }, 1000);
    } catch(e) { popup.close(); this.socialPopup = null; if (!this.handleAuth(e)) this.setState(s => ({social: {...s.social, busy: false, error: e.message}})); }
  }
  async disconnectSocial(platform) {
    if (this.state.social.busy) return;
    this.setState(s => ({social: {...s.social, busy: true, error: null}}));
    try { await this.api.disconnectSocialAccount(platform); await this.loadSocialAccounts(); }
    catch(e) { if (!this.handleAuth(e)) this.setState(s => ({social: {...s.social, error: e.message}})); }
    finally { this.setState(s => ({social: {...s.social, busy: false}})); }
  }
  renderId(result = this.state.result) {
    return result?.id || /\/rendered\/(rnd_[a-f0-9]+)/.exec(result?.url || '')?.[1];
  }
  async openResult(result) {
    this.setState(s=>({result,route:'result',publishing:{...s.publishing,history:[]}}));
    const id=this.renderId(result), epoch=this.sessionRequest;
    if (!id || !this.api.getPublishingHistory) return;
    try { const history=await this.api.getPublishingHistory(id); if(epoch===this.sessionRequest&&id===this.renderId()&&this.state.me) this.setState(s=>({publishing:{...s.publishing,history}})); }
    catch(e) { if(epoch===this.sessionRequest) this.handleAuth(e); }
  }
  async openPublish(result = this.state.result) {
    const id = this.renderId(result);
    if (!id) return this.notify('Open a rendered Short from this backend to publish it.');
    clearTimeout(this.publishTimer);
    this.setState({route:'publish',result:{...result,id}});
    await this.loadPublish({...result,id});
  }
  async loadPublish(result, keepCopy = false) {
    const id = this.renderId(result), version = this.publishVersion = (this.publishVersion || 0) + 1;
    this.setState(s => ({publishing:{...s.publishing,loading:true,error:null,...(!keepCopy?{copy:{},selected:{},batch:null,history:[],creator:null,creatorError:null,settings:{youtube:{visibility:'private',made_for_kids:false,contains_synthetic_media:false},tiktok:{privacy:'',allow_comment:false,allow_duet:false,allow_stitch:false,brand_content:false,brand_organic:false,is_aigc:false,consent:false},instagram:{share_to_feed:true}}}:{})}}));
    try {
      const [accounts, copy, history] = await Promise.all([this.api.listSocialAccounts(),this.api.getSocialCopy(id),this.api.getPublishingHistory(id)]);
      if (version !== this.publishVersion || !this.state.me || this.disposed) return;
      this.setState(s => ({social:{...s.social,...accounts},publishing:{...s.publishing,loading:false,copy:keepCopy?s.publishing.copy:{youtube:{title:'',description:'',hashtags:[]},tiktok:{caption:'',hashtags:[]},x:{text:''},...copy.copy},history,sourceTranscript:copy.source_transcript,transcriptConfirmed:!!copy.transcript_verified,batch:history[0]||null}}));
      const tiktok = accounts.accounts.find(a=>a.platform==='tiktok'&&a.status==='connected');
      if (tiktok) {
        try { const creator=await this.api.getTikTokCreatorInfo(); if(version===this.publishVersion&&this.state.me) this.setState(s=>({publishing:{...s.publishing,creator,creatorError:null}})); }
        catch(e) { if(version===this.publishVersion&&!this.handleAuth(e)) this.setState(s=>({publishing:{...s.publishing,creator:null,creatorError:e.message}})); }
      }
      if (version!==this.publishVersion || !this.state.me) return;
      if (!keepCopy && copy.transcript_verified && accounts.copy_available && Object.keys(copy.copy).length===0) await this.generateSocialCopy(null, false);
      const active=history.find(b=>b.jobs.some(j=>!['published','failed'].includes(j.status)));
      if (version===this.publishVersion && active) this.pollPublish(active.id,id);
    } catch(e) { if(version===this.publishVersion&&!this.handleAuth(e)) this.setState(s=>({publishing:{...s.publishing,loading:false,error:e.message}})); }
  }
  editSocialCopy(platform, field, value) {
    this.setState(s => ({publishing:{...s.publishing,error:null,copy:{...s.publishing.copy,[platform]:{...s.publishing.copy[platform],[field]:value}}}}));
    this.publishKey = null;
  }
  editPublishSetting(platform, field, value) {
    this.setState(s => ({publishing:{...s.publishing,settings:{...s.publishing.settings,[platform]:{...s.publishing.settings[platform],[field]:value}}}})); this.publishKey=null;
  }
  selectPublishPlatform(platform, value) {
    this.setState(s=>({publishing:{...s.publishing,selected:{...s.publishing.selected,[platform]:value}}})); this.publishKey=null;
  }
  async generateSocialCopy(platform = null, regenerate = true) {
    if (this.state.publishing.busy) return;
    const id=this.renderId(), version=this.publishVersion;
    this.setState(s=>({publishing:{...s.publishing,busy:true,error:null}}));
    try {
      const result=await this.api[regenerate?'regenerateSocialCopy':'generateSocialCopy'](id,{platforms:platform?[platform]:PLATFORMS,transcript_confirmed:!!this.state.publishing.transcriptConfirmed});
      if(version!==this.publishVersion||id!==this.renderId()||!this.state.me) return;
      this.setState(s=>({publishing:{...s.publishing,copy:{...s.publishing.copy,...Object.fromEntries((platform?[platform]:PLATFORMS).map(p=>[p,result.copy[p]]))}}})); this.publishKey=null;
    } catch(e) { if(version===this.publishVersion&&!this.handleAuth(e)) this.setState(s=>({publishing:{...s.publishing,error:e.message}})); }
    finally { if(version===this.publishVersion) this.setState(s=>({publishing:{...s.publishing,busy:false}})); }
  }
  async saveSocialDraft(platform) {
    const id=this.renderId(), version=this.publishVersion;
    const data=this.state.publishing.copy[platform]; if(!data) return;
    const fields=platform==='youtube'?['title','description','hashtags']:platform==='tiktok'||platform==='instagram'?['caption','hashtags']:['text'];
    if(fields.some(f=>data[f]===undefined||(typeof data[f]==='string'&&!data[f].trim()))) return;
    try { await this.api.saveSocialCopy(id,{copy:{[platform]:data}}); }
    catch(e) { if(version===this.publishVersion&&this.state.me&&id===this.renderId()&&!this.handleAuth(e)) this.setState(s=>({publishing:{...s.publishing,error:e.message}})); }
  }
  async publishEverywhere() {
    const state=this.state.publishing;
    if(state.busy || state.loading) return;
    const id=this.renderId(), version=this.publishVersion;
    const targets=Object.keys(state.selected).filter(p=>state.selected[p]&&!state.history.some(b=>b.jobs.some(j=>j.platform===p))).map(platform=>({platform,social_account_id:this.state.social.accounts.find(a=>a.platform===platform)?.id,[platform]:{...state.copy[platform],...(state.settings[platform]||{})}}));
    if(!targets.length) return;
    const when=state.when||{mode:'now'};
    let scheduled_at=null;
    if(when.mode==='schedule'){
      scheduled_at=window.ShortsServices.localInputToIso(when.at);
      if(!scheduled_at||new Date(scheduled_at).getTime()<Date.now()+60e3) return this.setState(s=>({publishing:{...s.publishing,error:window.ShortsServices.ERROR_COPY.SCHEDULE_IN_PAST}}));
    }
    this.publishKey=this.publishKey||idem();
    this.setState(s=>({publishing:{...s.publishing,busy:true,error:null}}));
    try {
      const batch=await this.api.publishRender(id,{targets,approved:true,...(scheduled_at?{scheduled_at}:{})},{idempotencyKey:this.publishKey});
      if(version!==this.publishVersion||id!==this.renderId()||!this.state.me) return;
      this.setState(s=>({publishing:{...s.publishing,selected:{},when:{mode:'now',at:''},batch,history:[batch,...s.publishing.history.filter(b=>b.id!==batch.id)]}}));
      this.pollPublish(batch.id,id);
    } catch(e) { if(version===this.publishVersion&&!this.handleAuth(e)) this.setState(s=>({publishing:{...s.publishing,error:e.message}})); }
    finally { if(version===this.publishVersion) this.setState(s=>({publishing:{...s.publishing,busy:false}})); }
  }
  async pollPublish(batchId,renderId) {
    clearTimeout(this.publishTimer);
    const version=this.publishVersion;
    try {
      const batch=await this.api.getPublishBatch(batchId);
      const other=await Promise.all(this.state.publishing.history.filter(b=>b.id!==batchId&&b.jobs.some(j=>!['published','failed'].includes(j.status))).map(b=>this.api.getPublishBatch(b.id)));
      if(version!==this.publishVersion||!this.state.me||renderId!==this.renderId()||this.state.route!=='publish') return;
      this.setState(s=>({publishing:{...s.publishing,batch,history:[batch,...s.publishing.history.filter(b=>b.id!==batch.id).map(b=>other.find(updated=>updated.id===b.id)||b)]}}));
      // Poll quickly while posts are in flight; scheduled-only batches just need an occasional check.
      const pending=this.state.publishing.history.flatMap(b=>b.jobs).filter(j=>!['published','failed'].includes(j.status));
      if(pending.length) this.publishTimer=setTimeout(()=>this.pollPublish(batchId,renderId),pending.every(j=>j.status==='scheduled')?60000:3000);
    } catch(e) {
      if(version!==this.publishVersion||!this.state.me) return;
      if(!this.handleAuth(e)) { this.setState(s=>({publishing:{...s.publishing,error:'We could not refresh publishing status. Your jobs are still saved. Try refreshing the status.'}})); }
    }
  }
  setPublishWhen(patch) {
    this.publishKey=null;  // a different time is a different request
    this.setState(s=>({publishing:{...s.publishing,error:null,when:{mode:'now',at:'',...s.publishing.when,...patch}}}));
  }
  async changeSchedule(batch, action, localValue) {
    if(this.state.publishing.busy) return;
    const version=this.publishVersion, id=this.renderId();
    let scheduled_at=null;
    if(action==='reschedule'){
      scheduled_at=window.ShortsServices.localInputToIso(localValue);
      if(!scheduled_at) return this.setState(s=>({publishing:{...s.publishing,error:window.ShortsServices.ERROR_COPY.SCHEDULE_IN_PAST}}));
    }
    this.setState(s=>({publishing:{...s.publishing,busy:true,error:null}}));
    try {
      const updated=action==='cancel'?await this.api.cancelPublishBatch(batch.id):await this.api.reschedulePublishBatch(batch.id,{scheduled_at});
      if(version!==this.publishVersion||id!==this.renderId()||!this.state.me) return;
      this.setState(s=>({publishing:{...s.publishing,history:s.publishing.history.map(b=>b.id===updated.id?updated:b).filter(b=>b.jobs.length)}}));
      this.notify(action==='cancel'?'Scheduled posts canceled. Nothing was published.':'Posts rescheduled.');
    } catch(e) { if(version===this.publishVersion&&!this.handleAuth(e)) this.setState(s=>({publishing:{...s.publishing,error:e.message}})); }
    finally { if(version===this.publishVersion) this.setState(s=>({publishing:{...s.publishing,busy:false}})); }
  }
  async retrySocialJob(job) {
    if(this.state.publishing.busy) return;
    const version=this.publishVersion, id=this.renderId();
    this.setState(s=>({publishing:{...s.publishing,busy:true,error:null}}));
    try { await this.api.retryPublishJob(job.id); if(version!==this.publishVersion||id!==this.renderId()||!this.state.me) return; this.pollPublish(this.state.publishing.history.find(b=>b.jobs.some(j=>j.id===job.id))?.id,this.renderId()); }
    catch(e) { if(version===this.publishVersion&&!this.handleAuth(e)) this.setState(s=>({publishing:{...s.publishing,error:e.message}})); }
    finally { if(version===this.publishVersion) this.setState(s=>({publishing:{...s.publishing,busy:false}})); }
  }
  async loadUsage() {
    this.setState({ usageLoading: true, usageError: null });
    try { const result = await this.api.getUsage(); this.setState({ usageEntries: result.entries || [] }); await this.refreshMe(); }
    catch (e) { if (!this.handleAuth(e)) this.setState({ usageError: e.message }); }
    finally { this.setState({ usageLoading: false }); }
  }
  async deleteProject(id) {
    try {
      await this.api.deleteProject(id);
      const url = this.state.previewUrls[id];
      if (url && url.startsWith('blob:')) URL.revokeObjectURL(url);
      this.setState(s => { const previewUrls = { ...s.previewUrls }; delete previewUrls[id]; return { projects: s.projects.filter(p => p.id !== id), previewUrls }; });
      this.notify('Project deleted.'); return true;
    } catch (e) { if (!this.handleAuth(e)) this.notify(e.message); return false; }
  }

  async openProject(p) {
    this.stopPolling();
    this.setState({ projectId: p.id, project: p, transcript: null, clipsRes: null, drafts: {}, selected: {}, status: null, renderedClips: [], result: null, renderError: null, previewId: null });
    if (p.status === 'expired') return this.notify('This project’s analysis has expired under the 30-day retention policy.');
    if (p.status === 'ready') return this.openSuggestions(p.id);
    this.setState({ route: 'processing' });
    this.pollStatus(); this.startPolling();
  }

  startPolling() { this.stopPolling(); this.poller = setInterval(() => this.pollStatus(), 700); }
  stopPolling() { clearInterval(this.poller); this.poller = null; }
  async pollStatus() {
    const id = this.state.projectId;
    if (!id) return;
    try {
      const st = await this.api.getStatus(id);
      if (id !== this.state.projectId || !this.state.me) return;
      this.setState({ status: st });
      if (!st.stage) {
        this.stopPolling();
        const [project] = await Promise.all([this.api.getProject(id), this.refreshMe()]);
        if (id !== this.state.projectId || !this.state.me) return;
        this.setState({ project });
        if (st.jobType === 'analysis') {
          if (st.regenError) this.notify('Regeneration failed — your previous suggestions are kept.');
          else { await this.loadClips(id); this.notify('Suggestions regenerated.'); }
        }
      }
    } catch (e) { if (!this.handleAuth(e) && e.code !== 'SESSION_CHANGED') this.notify('We could not refresh progress. Checking again shortly.'); }
  }

  async openSuggestions(id) {
    this.setState({ route: 'suggestions' });
    await this.loadClips(id);
    if (!this.state.transcript) this.loadTranscript(id);
  }
  async loadClips(id) {
    this.setState({ clipsError: null });
    try {
      const [res, playback, downloads] = await Promise.all([
        this.api.getClips(id),
        this.api.getProjectPlayback(id).catch(() => null),
        this.api.getProjectDownloads(id).catch(() => []),
      ]);
      if (id !== this.state.projectId || !this.state.me) return;
      const playbackUrl = playback ? this.mediaUrl(playback.url) : null;
      const renderedClips = downloads.filter((item) => item.kind === 'mp4').map((item) => ({
        ...item, url: this.mediaUrl(item.url),
        downloadUrl: this.mediaUrl(item.downloadUrl || item.url),
      }));
      const captionFiles = {};
      downloads.filter((item) => (item.kind === 'srt' || item.kind === 'ass') && item.renderId)
        .forEach((item) => { (captionFiles[item.renderId] = captionFiles[item.renderId] || []).push(item); });
      this.setState((s) => {
        const previousUrl = s.previewUrls[id];
        if (playbackUrl && previousUrl && previousUrl.startsWith('blob:') && typeof URL !== 'undefined') URL.revokeObjectURL(previousUrl);
        return {
          clipsRes: res,
          renderedClips, captionFiles,
          previewUrls: playbackUrl ? { ...s.previewUrls, [id]: playbackUrl } : s.previewUrls,
          regen: { goal: res.goal || s.regen.goal, instruction: res.instruction || '', avoid: (res.avoid || []).join(', ') },
        };
      });
    } catch (e) { if (!this.handleAuth(e)) this.setState({ clipsError: e.message }); }
  }
  async loadTranscript(id) {
    const request = this.transcriptRequest = (this.transcriptRequest || 0) + 1;
    this.setState({ transcriptError: null });
    try { const transcript = await this.api.getTranscript(id); if (id === this.state.projectId && request === this.transcriptRequest) this.setState({ transcript, drafts: {} }); }
    catch (e) { if (!this.handleAuth(e)) this.setState({ transcriptError: e.message }); }
  }

  /* new project */
  setNp(patch) { this.setState((s) => ({ np: { ...s.np, ...patch } })); }
  onFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file || this.state.np.busy) return;
    const version = this.probeVersion = (this.probeVersion || 0) + 1;
    if (this.state.pendingPreviewUrl && typeof URL !== 'undefined') URL.revokeObjectURL(this.state.pendingPreviewUrl);
    this.setNp({ probing: true, error: null, code: null, source: null });
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'metadata';
    const done = (ok) => {
      if (version !== this.probeVersion) { URL.revokeObjectURL(url); return; }
      if (ok && (!Number.isFinite(v.duration) || v.duration < window.ShortsServices.CONFIG.minDurationSec || v.duration > window.ShortsServices.CONFIG.maxDurationSec || file.size > window.ShortsServices.CONFIG.maxBytes)) {
        URL.revokeObjectURL(url); this.setState({ pendingPreviewUrl: null, pendingFile: null });
        this.setNp({ probing: false, source: null, error: 'Choose a video between 30 seconds and 3 hours, up to 4 GB.' }); return;
      }
      if (!ok) {
        URL.revokeObjectURL(url); this.setState({ pendingPreviewUrl: null, pendingFile: null });
        this.setNp({ probing: false, source: null, error: 'This browser could not read the video. Try an MP4, MOV, or WebM file.' }); return;
      }
      if (ok) this.setState({ pendingPreviewUrl: url, pendingFile: file });
      else { if (typeof URL !== 'undefined') URL.revokeObjectURL(url); this.setState({ pendingPreviewUrl: null, pendingFile: null }); }
      this.setNp({ probing: false, source: { fileName: file.name, title: file.name.replace(/\.[^.]+$/, ''), mimeType: file.type, sizeBytes: file.size, durationSec: ok ? v.duration : 0, width: ok ? v.videoWidth : 0, height: ok ? v.videoHeight : 0, fps: 30, hasVideo: ok && v.videoWidth > 0, hasAudio: true } });
    };
    v.onloadedmetadata = () => done(true);
    v.onerror = () => done(false);
    v.src = url;
  }

  async start() {
    const { np } = this.state;
    if (np.busy) return;
    const previewUrl = this.state.pendingPreviewUrl;
    const file = this.state.pendingFile;
    const body = { goal: np.goal, instruction: np.instruction, avoid: parseAvoid(np.avoid) };
    this.setNp({ busy: true, error: null, code: null });
    try {
      if (np.tab === 'url') {
        const p = await this.api.createYoutubeProject({ url: np.url, rightsConfirmed: np.rights });
        this.setState({ projectId: p.id, project: p, route: 'processing', status: null, transcript: null, clipsRes: null, selected: {} });
        await this.api.processProject(p.id, body, { idempotencyKey: idem() });
        this.afterStart();
        return;
      }
      if (!file) throw new Error('Choose a source video file to upload.');
      const up = await this.api.createUpload(np.source);
      this.setState((s) => ({ projectId: up.projectId, project: up.project, route: 'processing', status: null, uploading: true, uploadPct: 0, transcript: null, clipsRes: null, selected: {}, pendingPreviewUrl: null, pendingFile: null, previewUrls: previewUrl ? { ...s.previewUrls, [up.projectId]: previewUrl } : s.previewUrls }));
      await this.api.uploadMedia(up.uploadId, file);
      await this.api.completeUpload(up.uploadId);
      const status = await this.api.processProject(up.projectId, body, { idempotencyKey: idem() });
      this.setState({ uploading: false, status });
      this.afterStart();
    } catch (e) {
      if (!this.handleAuth(e) && e.code !== 'SESSION_CHANGED') {
        this.setState({ route: 'new', pendingFile: file, pendingPreviewUrl: previewUrl });
        this.setNp({ error: e.message, code: e.code });
      }
    } finally { this.setState({ uploading: false }); this.setNp({ busy: false }); }
  }
  afterStart() {
    this.setNp({ source: null, instruction: '', avoid: '', url: '', rights: false });
    this.refreshMe(); this.pollStatus(); this.startPolling();
  }

  async cancel() {
    try { const st = await this.api.cancelProject(this.state.projectId); this.stopPolling(); this.setState({ status: st }); this.refreshMe(); this.notify('Processing canceled. Only processed minutes were counted.'); }
    catch (e) { this.notify(e.message); }
  }
  async retry() {
    try { await this.api.retryProject(this.state.projectId, {}, { idempotencyKey: idem() }); this.pollStatus(); this.startPolling(); }
    catch (e) { this.notify(e.message); }
  }

  async saveTranscript() {
    if (this.state.savingTranscript) return;
    this.setState({ savingTranscript: true });
    const segments = Object.entries(this.state.drafts).map(([id, text]) => ({ id, text }));
    try {
      const t = await this.api.saveTranscript(this.state.projectId, { segments });
      this.setState({ transcript: t, drafts: {} });
      this.notify('Saved as revision ' + t.revision + '.');
      this.setState({ project: await this.api.getProject(this.state.projectId) });
    } catch (e) { this.notify(e.message); }
    finally { this.setState({ savingTranscript: false }); }
  }
  async download(kind) {
    try {
      const items = await this.api.getProjectDownloads(this.state.projectId);
      const it = items.find((i) => i.kind === kind);
      if (!it) throw new Error('This download is not available. Try again after processing finishes.');
      const a = document.createElement('a'); a.href = this.mediaUrl(it.url); a.download = it.filename; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { this.notify(e.message); }
  }

  /* captions */
  async loadCaptions(clipId) {
    const projectId = this.state.projectId;
    this.setState({ captions: { clipId, track: null, draft: null, loading: true, error: null, saving: false, dirty: false, confirmReset: false, texts: {} } });
    try {
      const [track, presets] = await Promise.all([
        this.api.getCaptions(projectId, clipId),
        this.state.captionPresets.length ? this.state.captionPresets : this.api.listCaptionPresets(),
      ]);
      if (projectId !== this.state.projectId || this.state.captions.clipId !== clipId) return;
      this.setState((s) => ({ captionPresets: presets, captions: { ...s.captions, track, draft: track.chunks, loading: false } }));
    } catch (e) {
      if (this.handleAuth(e) || this.state.captions.clipId !== clipId) return;
      const error = e.code ? e.message : 'Captions could not load. Try again.';
      this.setState((s) => ({ captions: { ...s.captions, loading: false, error } }));
    }
  }
  setCaptionDraft(draft) { this.setState((s) => ({ captions: { ...s.captions, draft, dirty: true, texts: {} } })); }
  typeCaptionText(index, text) { this.setState((s) => ({ captions: { ...s.captions, texts: { ...s.captions.texts, [index]: text } } })); }
  // Applied when the field loses focus, so typing never re-times words mid-edit.
  editCaptionText(index, text) {
    const current = this.state.captions.draft[index].words.map((w) => w.text).join(' ');
    if (text.trim().split(/\s+/).join(' ') === current) return this.setState((s) => ({ captions: { ...s.captions, texts: {} } }));
    const draft = this.state.captions.draft.slice();
    const next = window.ShortsServices.retimeCaptionText(draft[index], text);
    if (next) draft[index] = next; else draft.splice(index, 1);
    this.setCaptionDraft(draft);
  }
  nudgeCaption(index, delta) {
    const { draft, track } = this.state.captions;
    const { chunks, moved } = window.ShortsServices.nudgeCaption(draft, index, delta, track.clipStart, track.clipEnd);
    if (!moved) return this.notify('There is no room to move this caption further.');
    this.setCaptionDraft(chunks);
  }
  // PATCH the caption track; unsaved text/timing edits always travel with it.
  async saveCaptions(patch = {}) {
    const { captions, projectId } = this.state;
    if (!captions.track || captions.saving) return false;
    const body = { ...patch };
    if (captions.dirty && !patch.reset) body.chunks = captions.draft.map((c) => ({ words: c.words.map(({ text, start, end, estimated }) => ({ text, start, end, estimated: !!estimated })) }));
    this.setState((s) => ({ captions: { ...s.captions, saving: true, error: null } }));
    try {
      const track = await this.api.saveCaptions(projectId, captions.clipId, body);
      this.setState((s) => ({ captions: { ...s.captions, track, draft: track.chunks, saving: false, dirty: false, confirmReset: false, texts: {} } }));
      return true;
    } catch (e) {
      if (!this.handleAuth(e)) this.setState((s) => ({ captions: { ...s.captions, saving: false, error: e.message } }));
      return false;
    }
  }
  toggleFillers() {
    const { track, dirty } = this.state.captions;
    if (!track) return;
    if (track.edited || dirty) return this.setState((s) => ({ captions: { ...s.captions, confirmReset: true } }));
    this.saveCaptions({ keepFillers: !track.keepFillers });
  }

  async renderClip(clipId) {
    if (this.state.renderingId) return;
    const projectId = this.state.projectId;
    const clip = this.state.clipsRes?.clips.find(c => c.id === clipId);
    const { captions, burnCaptions, framing } = this.state;
    // Burn in exactly what the creator sees: save pending caption edits first.
    if (burnCaptions && captions.clipId === clipId && captions.dirty && !(await this.saveCaptions())) {
      this.setState({ renderError: 'Save your caption edits before rendering.' });
      return;
    }
    this.setState({ renderingId: clipId, renderError: null });
    try {
      const result = await this.api.renderClip(projectId, { clipId, resolution: this.state.resolution, captions: burnCaptions, framing });
      if (this.state.projectId !== projectId || !this.state.me) return result;
      const rendered = { ...result, url: this.mediaUrl(result.url), downloadUrl: this.mediaUrl(result.downloadUrl || result.url), hook: clip?.hook };
      this.setState({ result: rendered, ...(this.state.route === 'editor' && this.state.previewId === clipId ? { route: 'result' } : {}) });
      if (this.state.route !== 'result') this.notify('Your Short is ready. Open the project to download it.');
      await this.loadClips(projectId);
      if(this.state.route==='result'&&this.state.result?.id===rendered.id) await this.openResult(rendered);
      return result;
    } catch (e) { if (!this.handleAuth(e)) this.setState({ renderError: e.message }); }
    finally { this.setState({ renderingId: null }); }
  }

  async regenerate() {
    const { regen, projectId } = this.state;
    try {
      const st = await this.api.createAnalysisRun(projectId, { goal: regen.goal, instruction: regen.instruction, avoid: parseAvoid(regen.avoid) }, { idempotencyKey: idem() });
      this.setState({ status: st, selected: {} }); this.startPolling();
    } catch (e) { this.notify(e.message); }
  }

  async runTests() {
    if (!window.ShortsTests) return;
    this.setState((s) => ({ tests: { ...s.tests, running: true, results: [] } }));
    await window.ShortsTests.run((r, all) => this.setState((s) => ({ tests: { ...s.tests, results: all.slice() } })));
    this.setState((s) => ({ tests: { ...s.tests, running: false } }));
  }


  /* ---------- Story Mode ---------- */
  storyState(patch) { this.setState((s) => ({ story: { ...s.story, ...(typeof patch === 'function' ? patch(s.story) : patch) } })); }
  stopStoryPolling() { clearTimeout(this.storyPoller); this.storyPoller = null; }
  async loadStoryOptions(force = false) {
    const epoch = this.sessionRequest;
    try {
      const [genres, voices, assets] = await Promise.all([
        this.storyOptionsLoaded && !force ? null : this.api.listStoryGenres(),
        this.storyOptionsLoaded && !force ? null : this.api.listStoryVoices(),
        this.api.listStoryAssets(),
      ]);
      if (epoch !== this.sessionRequest || this.disposed) return;
      this.storyOptionsLoaded = true;
      this.storyState((st) => {
        const next = { assets, optionsError: null };
        if (genres) Object.assign(next, { genres: genres.genres, lengths: genres.lengths });
        if (voices) {
          const usable = voices.providers.filter((p) => p.available);
          const provider = usable.find((p) => p.id === voices.defaultProvider) || usable[0];
          Object.assign(next, { providers: voices.providers, defaultProvider: voices.defaultProvider });
          if (!st.voiceChoice.provider && provider) next.voiceChoice = { provider: provider.id, voice: provider.voices[0]?.id, speed: provider.defaultSpeed };
        }
        return next;
      });
    } catch (e) { if (epoch === this.sessionRequest && !this.handleAuth(e)) this.storyState({ optionsError: e.message }); }
  }
  newStory() { this.go('new'); this.setNp({ tab: 'story', error: null, code: null }); this.loadStoryOptions(); }
  async createStory() {
    const st = this.state.story, f = st.form;
    if (st.creating) return;
    const epoch = this.sessionRequest;
    this.storyState({ creating: true, createError: null });
    try {
      const body = { genre: f.genre, targetSeconds: f.seconds, tone: f.tone.trim() };
      body[f.mode] = (f.mode === 'topic' ? f.topic : f.story).trim();
      const story = await this.api.createStory(body);
      if (epoch !== this.sessionRequest) return;
      this.storyState({ form: { ...f, topic: '', story: '' } });
      this.openStory(story.id, story);
    } catch (e) { if (epoch === this.sessionRequest && !this.handleAuth(e)) this.storyState({ createError: e.message }); }
    finally { this.storyState({ creating: false }); }
  }
  async loadStories() {
    const epoch = this.sessionRequest;
    this.storyState({ listLoading: true, listError: null });
    try {
      const [{ stories }] = await Promise.all([this.api.listStories(), this.storyOptionsLoaded ? null : this.loadStoryOptions()]);
      if (epoch === this.sessionRequest) this.storyState({ list: stories });
    } catch (e) { if (epoch === this.sessionRequest && !this.handleAuth(e)) this.storyState({ listError: e.message }); }
    finally { this.storyState({ listLoading: false }); }
  }
  async openStory(id, story = null) {
    this.go('story');
    this.storyState({ currentId: id, current: null, draft: null, dirty: false, busy: null, scriptError: null, loadError: null, audioUrl: null, audioFor: null, renders: [], renderChoice: null, imageLinks: [] });
    this.loadStoryOptions();
    if (story) this.showStory(story);
    else await this.reloadStory();
    this.loadStoryRenders();
  }
  async reloadStory() {
    const id = this.state.story.currentId, epoch = this.sessionRequest;
    if (!id) return;
    try { const story = await this.api.getStory(id); if (epoch === this.sessionRequest && id === this.state.story.currentId) this.showStory(story); }
    catch (e) { if (epoch === this.sessionRequest && !this.handleAuth(e)) this.storyState({ loadError: e.message }); }
  }
  // Show the server's story; keep unsaved script edits; follow running jobs.
  showStory(story) {
    const before = this.state.story.current;
    const settings = story.renderSettings, bg = settings.background;
    this.storyState((st) => ({
      current: story,
      draft: st.dirty && st.draft ? st.draft : JSON.parse(JSON.stringify(story.script)),
      voiceChoice: story.voice ? { provider: story.voice.provider, voice: story.voice.voice, speed: story.voice.speed } : st.voiceChoice,
      renderChoice: st.renderChoice && before?.id === story.id ? st.renderChoice : { ...settings, background: { kind: bg.kind, id: bg.id || bg.name || bg.projectId } },
    }));
    const voiceKey = story.voice ? story.revision + ':' + story.voice.durationSec + story.voice.voice + story.voice.speed : null;
    if (story.voice && this.state.story.audioFor !== voiceKey && story.status !== 'voicing') this.loadStoryAudio(story.id, voiceKey);
    if (before && before.status === 'rendering' && story.status === 'rendered') { this.loadStoryRenders(); this.loadStoryImages(story); this.notify('Your Short is ready.'); }
    if (!before && story.images) this.loadStoryImages(story);

      saveLabel: dirty ? 'Save ' + dirty + (dirty === 1 ? ' edit' : ' edits') : 'Saved',
      saveTranscript: () => this.saveTranscript(), downloadTxt: () => this.download('txt'), downloadJson: () => this.download('json'),
      // suggestions
      clips, renderedClips, hasRenderedClips: renderedClips.length > 0,
      clipsKicker: cr ? cr.clips.length + ' suggestions · ' + (GOALS.find((g) => g.id === cr.goal) || { label: '' }).label + (cr.instruction ? ' · “' + cr.instruction + '”' : '') : 'Loading suggestions…',
      clipsStale: !!(cr && cr.stale) && !regenerating,
      runMeta: cr ? 'run ' + cr.runId + ' · prompt ' + cr.promptVersion + ' · ' + cr.modelName : '',
      regenGoals: GOALS.map((g) => ({ label: g.label, pressed: String(s.regen.goal === g.id), bg: s.regen.goal === g.id ? 'var(--color-accent)' : 'transparent', fg: s.regen.goal === g.id ? 'var(--color-bg)' : 'var(--color-text)', pick: () => this.setState((x) => ({ regen: { ...x.regen, goal: g.id } })) })),
      regenInstruction: s.regen.instruction, onRegenInstruction: (e) => { const v = e.target.value; this.setState((x) => ({ regen: { ...x.regen, instruction: v } })); },
      regenAvoid: s.regen.avoid, onRegenAvoid: (e) => { const v = e.target.value; this.setState((x) => ({ regen: { ...x.regen, avoid: v } })); },
      regenerating, regenPct: st ? Math.round((st.progress || 0) * 100) : 0, regenerate: () => this.regenerate(),
      previewOpen: !!pc, pv, closePreview: () => this.setState({ previewId: null }), stop: (e) => e.stopPropagation(),
      // tests
      testsOpen: s.tests.open, testsRunning: s.tests.running, runLabel: s.tests.running ? 'Running…' : tr.length ? 'Run again' : 'Run all tests',
      runTests: () => this.runTests(), testRows,
      testSummary: tr.length ? (tr.length - failed) + ' passed · ' + failed + ' failed · ' + tr.length + ' of ' + total + ' run' : total + ' tests against the mock backend and HTTP client. Each test builds its own isolated backend with a fake clock.',
      toast: s.toast,
    };
    const labels = { boot: 'Loading', login: 'Sign in', dashboard: 'Dashboard', projects: 'Projects', new: 'New Project', processing: 'Processing', suggestions: 'Best moments', editor: 'Preview Short', result: 'Your Short', transcript: 'Transcript', usage: 'Usage', settings: 'Settings', socialAccounts: 'Social Accounts', publish: 'Publish Short', stories: 'Stories', story: 'Story' };
    Object.assign(values, {
      publishing: s.publishing, confirmSocialTranscript: value => this.setState(t=>({publishing:{...t.publishing,transcriptConfirmed:value}})), openPublish: result => this.openPublish(result || s.result), editSocialCopy: (p,f,v) => this.editSocialCopy(p,f,v), saveSocialDraft: p => this.saveSocialDraft(p), editPublishSetting: (p,f,v) => this.editPublishSetting(p,f,v), selectPublishPlatform: (p,v) => this.selectPublishPlatform(p,v), generateSocialCopy: p => this.generateSocialCopy(p), publishEverywhere: () => this.publishEverywhere(), retrySocialJob: job => this.retrySocialJob(job), setPublishWhen: patch => this.setPublishWhen(patch), cancelScheduled: batch => this.changeSchedule(batch,'cancel'), reschedulePublish: (batch,value) => this.changeSchedule(batch,'reschedule',value), msToLocalInput: ms => window.ShortsServices.msToLocalInput(ms), refreshPublish: () => this.loadPublish(s.result,true),
      story: this.storyView(),
      publishBack: () => (s.result?.storyId ? this.openStory(s.result.storyId) : this.go('result')),
      social: s.social, loadSocialAccounts: () => this.loadSocialAccounts(), connectSocial: platform => this.connectSocial(platform), disconnectSocial: platform => this.disconnectSocial(platform),
      bootError: s.bootError, restoreSession: () => this.restoreSession(), showLogin: () => this.resetSession(),
      route: s.route, pageLabel: labels[s.route], theme: s.theme, email: me?.user.email || '',
      initials: (me?.user.displayName || '').split(' ').map(part => part[0]).slice(0, 2).join(''),
      navigate: route => this.go(route), setTheme: theme => this.setTheme(theme),
      dashboardLoading: s.dashboardLoading, dashboardError: s.dashboardError, reloadProjects: () => this.loadDashboard(),
      deleteProject: id => this.deleteProject(id), pendingPreviewUrl: s.pendingPreviewUrl, npBusy: np.busy,
      sourceUrl: projectPreviewUrl, projectDuration: project.durationSec ? fmt(project.durationSec) : '',
      clipsLoaded: !!cr, clipsError: s.clipsError, reloadClips: () => this.loadClips(s.projectId),
      transcriptLoaded: !!s.transcript, transcriptError: s.transcriptError, savingTranscript: s.savingTranscript,
      resolution: s.resolution, setResolution: resolution => this.setState({ resolution }),
      renderingId: s.renderingId, renderError: s.renderError, renderPreview: () => pc && this.renderClip(pc.id),
      captions: captionView, captionFiles: s.captionFiles,
      sourceExpired: !!project.sourceExpired, result: s.result,
      openResult: result => this.openResult({ ...result, hook: result.hook || cr?.clips.find(c => c.id === result.clipId)?.hook }),
      copy: text => this.copy(text), usageLoading: s.usageLoading, usageError: s.usageError,
      loadUsage: () => this.loadUsage(), usageEntries: s.usageEntries.map(entry => ({
        title: s.projects.find(p => p.id === entry.projectId)?.name || 'Video processing',
        date: fmtDate(entry.createdAt), minutes: (Math.round(((entry.processedSeconds || 0) + (entry.adjustmentSeconds || 0)) / 60 * 10) / 10) + ' min',
      })),
    });
    return { ...values, appProps: { v: values } };
  }
}
